<!DOCTYPE html><html lang="vi"><head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trợ lý của UyennPu</title><meta charset="utf-8"><style>:root{

}

.rail{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}

.brand em{font-style:normal;font-weight:800;font-size:17px;letter-spacing:-.01em}

.ring{--p:0;width:112px;height:112px;border-radius:50%;flex:none;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.22) 0);display:grid;place-items:center;position:relative;text-align:center}

.mini{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--line2);color:var(--muted)}.mini.on{background:var(--ok-bg);color:var(--ok)}
.minis{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

.tab:hover{color:var(--red)}.tab.on{color:var(--red);border-bottom-color:var(--red)}
/* form */

.in,.ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;transition:.15s}

.ta{resize:vertical;line-height:1.5}.ta.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;background:#FCFAF9}
.in.sm,.ta.sm{padding:6px 9px;border-radius:8px;font-size:13px}.in.num{text-align:right}.in.pct{width:54px;display:inline-block;margin-right:3px;padding:2px 6px}
.cbs{display:flex;flex-wrap:wrap;gap:6px 16px}.cb{display:inline-flex;gap:7px;align-items:center;cursor:pointer;font-size:13.5px}.cb input{accent-color:var(--red);width:16px;height:16px}
.filebtn{cursor:pointer}

.remind{list-style:none;padding:0}.remind li{padding:9px 12px;border-radius:10px;background:var(--bg);margin-bottom:7px;font-size:13.5px;border-left:3px solid var(--red40)}
.warnt{color:var(--warn);font-size:12.5px;font-weight:600;display:block;margin-top:6px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}.pc-t{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}

.neg{color:var(--red);font-weight:700}.pos{color:var(--ok);font-weight:700}
/* bảng */
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}

.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}.tbl tr:hover td{background:#FDFAF9}
.tbl.edit td{padding:5px 6px}.tbl .act{white-space:nowrap;text-align:right}
.tbl.sum th,.tbl.sum td{text-align:center}.tbl.sum tbody th{text-align:left;background:none;color:var(--ink);text-transform:none;font-size:13px;letter-spacing:0}
.tbl .calc{display:block;padding:7px 4px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.sev-Cao td:first-child{box-shadow:inset 3px 0 0 var(--red)}.sev-TB td:first-child{box-shadow:inset 3px 0 0 #D99A32}.sev-Thấp td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
/* lịch */
.calwrap{padding:14px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}

.cal-d{display:flex;align-items:center;gap:4px;font-size:12px}.cal-d b{font-size:12.5px}.cal-d em{font-style:normal;color:var(--red);font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}

.pill.ok{border-left-color:var(--ok);background:var(--ok-bg)}.pill.warn{border-left-color:#D99A32;background:var(--warn-bg)}.pill.red{border-left-color:var(--red);background:var(--red10)}.pill:hover{filter:brightness(.96)}

.lint{list-style:none;padding:0;margin:10px 0}.lint li{display:flex;gap:10px;padding:7px 0;font-size:13.5px;align-items:flex-start}

.lint .ok i{background:var(--ok-bg);color:var(--ok)}.lint .bad i{background:var(--red);color:#fff}.lint .warn i{background:var(--warn-bg);color:var(--warn)}.lint .info i{background:var(--info-bg);color:var(--info)}
details.rules{margin-top:10px;font-size:13.5px}details summary{cursor:pointer;font-weight:600;color:var(--red)}details ul{margin:8px 0 8px 18px}details dt{font-weight:700;margin-top:8px}details dd{margin:0;color:var(--ink2)}

.ai-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.ai p{margin-top:6px;font-size:13.5px;color:var(--ink2)}.lb{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:6px}

.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.days div{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:12.5px}.days div.on{background:var(--ok-bg)}.days b,.days span{display:block}.days span{color:var(--muted);font-size:11.5px}

/* hộp thoại */
#layer{display:none}#layer.open{display:block}
.scrim{position:fixed;inset:0;background:rgba(42,33,36,.45);z-index:50;backdrop-filter:blur(2px)}

.modal-b{padding:18px 22px;overflow:auto;flex:1}.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line2);align-items:center}

function procFiles(files,p){var list=[].slice.call(files),left=list.length;if(!left)return;list.forEach(function(f){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);p.imgs.push({id:'i'+Date.now()+Math.random().toString(36).slice(2,5),d:cv.toDataURL('image/jpeg',.88),w:cv.width,h:cv.height});if(--left===0){if(!csv()){p.imgs.splice(p.imgs.length-list.length,list.length)}render()}};im.onerror=function(){if(--left===0)render()};im.src=r.result};r.readAsDataURL(f)})}
